name: Deploy OrientSol 3.0 to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Permisos requeridos para desplegar en GitHub Pages y actualizar rama gh-pages
permissions:
  contents: write
  pages: write
  id-token: write

# Permite una sola ejecución concurrente
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy OrientSol Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: orientsol-web/package-lock.json

      - name: Install Dependencies
        working-directory: orientsol-web
        run: npm ci

      - name: Build Application (con Secretos de Supabase)
        working-directory: orientsol-web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}

      # Despliegue a la rama gh-pages (fuente configurada en el repositorio)
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./orientsol-web/dist
