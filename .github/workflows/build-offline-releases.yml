name: Build & Deploy Offline Apps (Windows, macOS, Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Crear GitHub Release con los binarios adjuntos'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # 1. WINDOWS DESKTOP BUILD (.exe installer + portable)
  # --------------------------------------------------------------------------
  build-windows:
    name: Build Windows Desktop (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: orientsol-web/package-lock.json

      - name: Install Dependencies
        working-directory: orientsol-web
        run: npm ci

      - name: Build Web & Package Windows Electron
        working-directory: orientsol-web
        run: npm run build:win

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrientSol-Windows-x64
          path: |
            orientsol-web/release/*.exe
            !orientsol-web/release/*unpacked*

  # --------------------------------------------------------------------------
  # 2. MACOS DESKTOP BUILD (.dmg + .zip)
  # --------------------------------------------------------------------------
  build-macos:
    name: Build macOS Desktop (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: orientsol-web/package-lock.json

      - name: Install Dependencies
        working-directory: orientsol-web
        run: npm ci

      - name: Build Web & Package macOS Electron
        working-directory: orientsol-web
        run: npm run build:mac

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrientSol-macOS-Universal
          path: |
            orientsol-web/release/*.dmg
            orientsol-web/release/*.zip
            !orientsol-web/release/*unpacked*

  # --------------------------------------------------------------------------
  # 3. ANDROID MOBILE / TABLET BUILD (.apk)
  # --------------------------------------------------------------------------
  build-android:
    name: Build Android Mobile & Tablet (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: orientsol-web/package-lock.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Install Dependencies
        working-directory: orientsol-web
        run: npm ci

      - name: Build Web Application
        working-directory: orientsol-web
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: orientsol-web
        run: npx cap sync android

      - name: Build Android Debug APK with Gradle
        working-directory: orientsol-web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrientSol-Android-APK
          path: orientsol-web/android/app/build/outputs/apk/debug/*.apk

  # --------------------------------------------------------------------------
  # 4. GITHUB RELEASE AUTOMATION
  # --------------------------------------------------------------------------
  create-github-release:
    name: Publish Multiplatform Release
    needs: [build-windows, build-macos, build-android]
    if: always() && !cancelled() && (needs.build-windows.result == 'success' || needs.build-macos.result == 'success' || needs.build-android.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: OrientSol-Windows-x64
          path: release-binaries/windows

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: OrientSol-macOS-Universal
          path: release-binaries/macos

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: OrientSol-Android-APK
          path: release-binaries/android

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ github.ref_name || 'v4.0.0-offline' }}
          name: OrientSol 4.0 - Offline Releases (Windows / macOS / Android)
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-binaries/windows/*.exe
            release-binaries/macos/*.dmg
            release-binaries/macos/*.zip
            release-binaries/android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
